services:
  backend:
    build:
      context: ./backend
    environment:
      CRITIQAI_DB_PATH: /data/critiqai.db
    volumes:
      - critiqai_data:/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  critiqai_data:
